<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Expense Tracker</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Add New Expense</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/expense/save}" th:object="${expense}" method="post">
                            <div class="mb-3">
                                <label>Amount ₹</label>
                                <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Category</label>
                                <select th:field="*{category}" class="form-control" required>
                                    <option value="">Select Category</option>
                                    <option value="Food">Food</option>
                                    <option value="Travel">Travel</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Date</label>
                                <input type="date" th:field="*{expenseDate}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Payment Mode</label>
                                <select th:field="*{paymentMode}" class="form-control">
                                    <option value="Cash">Cash</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Card">Card</option>
                                    <option value="Net Banking">Net Banking</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success">Save Expense</button>
                            <a href="/dashboard" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
