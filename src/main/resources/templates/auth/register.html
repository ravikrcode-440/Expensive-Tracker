<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register - Expense Tracker</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card shadow">
					<div class="card-header text-center">
						<h3>Create Account</h3>
					</div>
					<!-- Success Message -->
					<div th:if="${param.success}" class="alert alert-success">
						Registration successful! Please login.</div>

					<!-- Error Message -->
					<div th:if="${#fields.hasErrors('user')}"
						class="alert alert-danger">
						<p th:each="err : ${#fields.errors('user')}" th:text="${err}"></p>
					</div>
					<div class="card-body">
						<form th:action="@{/register}" th:object="${user}" method="post">
							<div class="mb-3">
								<label>Name</label> <input type="text" th:field="*{name}"
									class="form-control" required>
								<p th:errors="*{name}" class="text-danger"
									th:if="${#fields.hasErrors('name')}"></p>
							</div>
							<div class="mb-3">
								<label>Email</label> <input type="email" th:field="*{email}"
									class="form-control" required>
								<p th:errors="*{email}" class="text-danger"
									th:if="${#fields.hasErrors('email')}"></p>
							</div>
							<div class="mb-3">
								<label>Password</label> <input type="password"
									th:field="*{password}" class="form-control" required>
								<p th:errors="*{password}" class="text-danger"
									th:if="${#fields.hasErrors('password')}"></p>
							</div>
							<button type="submit" class="btn btn-success w-100">Register</button>
						</form>
						<div class="text-center mt-3">
							<a th:href="@{/login}">Already have account? Login</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
